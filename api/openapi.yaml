openapi: 3.0.3
info:
  title: Paris Janitor — API
  version: 1.0.0
  description: >-
    API de la plateforme de conciergerie Paris Janitor. Périmètre : espace voyageur et back-office
    d’administration.


    **Authentification.** Toutes les routes protégées attendent un en-tête `Authorization: Bearer
    <jeton>`,

    obtenu par `POST /api/auth/login` ou `POST /api/auth/register`. Les routes marquées d’un cadenas
    dans cette

    page l’exigent ; les autres sont ouvertes. Les routes `/api/admin/*` exigent en plus le rôle
    administrateur.


    **Erreurs.** Toute erreur suit le même format : `{ "error": { "code", "message" } }`, avec un
    champ `details`

    supplémentaire sur les erreurs de validation. Les codes sont stables et documentés route par
    route.


    **Montants.** Tous les montants sont des entiers en centimes, jamais des flottants. Les taux
    sont exprimés

    en points de base : 2000 vaut 20 %.


    **Instantané tarifaire.** Le prix d’une réservation est figé à sa création. Modifier ensuite un
    barème, un

    tarif ou un taux de commission ne change aucune réservation ni facture déjà émise.


    **Webhooks.** L’état d’abonnement et le statut de paiement ne sont écrits que par les webhooks
    Stripe.

    Aucune route applicative ne passe un utilisateur en VIP ni une réservation en payée.
  license:
    name: Projet scolaire ESGI 3AL
servers:
  - url: /api
    description: Même origine que cette page
  - url: http://localhost:3000/api
    description: Développement local
tags:
  - name: Santé
    description: Disponibilité du service.
  - name: Authentification
    description: Inscription et ouverture de session. Jeton JWT valable 7 jours.
  - name: Compte
    description: Profil de l’utilisateur connecté.
  - name: Catalogue public
    description: Biens publiés, prestations actives et formules VIP. Sans authentification.
  - name: Devis
    description: Estimation partageant le code de calcul des réservations.
  - name: Réservations
    description: Séjours et prestations du voyageur, avec instantané tarifaire figé.
  - name: Paiements
    description: Paiement à l’acte par Stripe PaymentIntent.
  - name: Abonnement
    description: Formules VIP par Stripe Subscriptions.
  - name: Factures
    description: Factures archivées en PDF, jamais régénérées.
  - name: Fichiers
    description: Documents stockés en GridFS.
  - name: Avis
    description: Évaluation des prestations réalisées, soumise à modération.
  - name: Messagerie
    description: Fils de discussion rattachés aux prestations.
  - name: Fiches d’intervention
    description: Compte rendu de prestation, pré-rempli puis complété.
  - name: Simulateur
    description: Estimation publique de gains et collecte de demandes.
  - name: Webhooks Stripe
    description: Réception des événements Stripe.
  - name: Administration
    description: Back-office. Exige le rôle administrateur sur toutes les routes.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton renvoyé par /auth/login ou /auth/register, valable 7 jours. Pas de jeton de
        rafraîchissement.
  schemas:
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 8
          maxLength: 72
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          minLength: 6
          maxLength: 20
      required:
        - email
        - password
        - firstName
        - lastName
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    PricingRule:
      type: object
      properties:
        unit:
          type: string
          enum:
            - fixed
            - km
            - hour
            - m2
            - item
        baseCents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        tiers:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              upToQty:
                nullable: true
                type: number
                minimum: 0
                exclusiveMinimum: true
              unitPriceCents:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            required:
              - upToQty
              - unitPriceCents
        minCents:
          type: integer
          minimum: 100
          maximum: 9007199254740991
      required:
        - unit
        - baseCents
        - tiers
        - minCents
    CommissionTiers:
      minItems: 1
      type: array
      items:
        type: object
        properties:
          upToCents:
            nullable: true
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          rateBps:
            type: integer
            minimum: 0
            maximum: 10000
        required:
          - upToCents
          - rateBps
    VipPlanPatch:
      type: object
      properties:
        monthlyPriceCents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        yearlyPriceCents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        discountBps:
          type: integer
          minimum: 0
          maximum: 10000
        freeQuota:
          nullable: true
          type: object
          properties:
            windowMonths:
              type: integer
              minimum: 1
              maximum: 60
            maxAmountTtcCents:
              nullable: true
              type: integer
              minimum: 0
              exclusiveMinimum: true
              maximum: 9007199254740991
          required:
            - windowMonths
            - maxAmountTtcCents
        showAds:
          type: boolean
        priorityAccess:
          type: boolean
        renewalBonusBps:
          type: integer
          minimum: 0
          maximum: 10000
    SimulatorOption:
      type: object
      properties:
        key:
          type: string
          pattern: ^[a-z0-9_-]+$
        label:
          type: string
          minLength: 1
          maxLength: 120
        priceHtCents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        frequency:
          type: string
          enum:
            - per_stay
            - per_year
      required:
        - key
        - label
        - priceHtCents
        - frequency
    PlatformSettingsPatch:
      type: object
      properties:
        stayCommissionBps:
          type: integer
          minimum: 0
          maximum: 10000
        ownerYearlyFeeCents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        simulatorOptions:
          maxItems: 20
          type: array
          items:
            type: object
            properties:
              key:
                type: string
                pattern: ^[a-z0-9_-]+$
              label:
                type: string
                minLength: 1
                maxLength: 120
              priceHtCents:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              frequency:
                type: string
                enum:
                  - per_stay
                  - per_year
            required:
              - key
              - label
              - priceHtCents
              - frequency
    PricePreview:
      type: object
      properties:
        pricingRule:
          type: object
          properties:
            unit:
              type: string
              enum:
                - fixed
                - km
                - hour
                - m2
                - item
            baseCents:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            tiers:
              minItems: 1
              type: array
              items:
                type: object
                properties:
                  upToQty:
                    nullable: true
                    type: number
                    minimum: 0
                    exclusiveMinimum: true
                  unitPriceCents:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - upToQty
                  - unitPriceCents
            minCents:
              type: integer
              minimum: 100
              maximum: 9007199254740991
          required:
            - unit
            - baseCents
            - tiers
            - minCents
        qty:
          type: number
          minimum: 0
          exclusiveMinimum: true
      required:
        - pricingRule
        - qty
    Provider:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        job:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        phone:
          nullable: true
          type: string
          minLength: 6
          maxLength: 20
        status:
          type: string
          enum:
            - candidate
            - validated
            - suspended
      required:
        - name
        - job
        - email
    ProviderPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        job:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        phone:
          nullable: true
          type: string
          minLength: 6
          maxLength: 20
        status:
          type: string
          enum:
            - candidate
            - validated
            - suspended
    ServiceCategory:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description:
          type: string
          maxLength: 500
      required:
        - name
        - slug
    ServiceCategoryPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description:
          type: string
          maxLength: 500
    ServiceOffering:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 140
        description:
          type: string
          maxLength: 2000
        categoryId:
          type: string
          pattern: ^[0-9a-f]{24}$
        providerId:
          type: string
          pattern: ^[0-9a-f]{24}$
        pricingRule:
          type: object
          properties:
            unit:
              type: string
              enum:
                - fixed
                - km
                - hour
                - m2
                - item
            baseCents:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            tiers:
              minItems: 1
              type: array
              items:
                type: object
                properties:
                  upToQty:
                    nullable: true
                    type: number
                    minimum: 0
                    exclusiveMinimum: true
                  unitPriceCents:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - upToQty
                  - unitPriceCents
            minCents:
              type: integer
              minimum: 100
              maximum: 9007199254740991
          required:
            - unit
            - baseCents
            - tiers
            - minCents
        vatRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        vipOnly:
          type: boolean
        priorityAccess:
          type: boolean
        active:
          type: boolean
      required:
        - name
        - categoryId
        - providerId
        - pricingRule
    ServiceOfferingPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 140
        description:
          type: string
          maxLength: 2000
        categoryId:
          type: string
          pattern: ^[0-9a-f]{24}$
        providerId:
          type: string
          pattern: ^[0-9a-f]{24}$
        pricingRule:
          type: object
          properties:
            unit:
              type: string
              enum:
                - fixed
                - km
                - hour
                - m2
                - item
            baseCents:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            tiers:
              minItems: 1
              type: array
              items:
                type: object
                properties:
                  upToQty:
                    nullable: true
                    type: number
                    minimum: 0
                    exclusiveMinimum: true
                  unitPriceCents:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - upToQty
                  - unitPriceCents
            minCents:
              type: integer
              minimum: 100
              maximum: 9007199254740991
          required:
            - unit
            - baseCents
            - tiers
            - minCents
        vatRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        vipOnly:
          type: boolean
        priorityAccess:
          type: boolean
        active:
          type: boolean
    Property:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 140
        description:
          type: string
          maxLength: 4000
        address:
          type: object
          properties:
            street:
              type: string
              minLength: 3
              maxLength: 200
            postalCode:
              type: string
              pattern: ^75[0-9]{3}$
            city:
              default: Paris
              type: string
              minLength: 1
            arrondissement:
              type: integer
              minimum: 1
              maximum: 20
          required:
            - street
            - postalCode
            - arrondissement
        capacity:
          type: integer
          minimum: 1
          maximum: 30
        bedrooms:
          type: integer
          minimum: 0
          maximum: 20
        surfaceM2:
          type: integer
          minimum: 5
          maximum: 2000
        amenities:
          type: array
          items:
            type: string
            minLength: 1
        nightlyRateHtCents:
          type: integer
          minimum: 100
          maximum: 9007199254740991
        vatRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        blockedRanges:
          type: array
          items:
            type: object
            properties:
              start:
                type: string
                format: date-time
              end:
                type: string
                format: date-time
            required:
              - start
              - end
        status:
          type: string
          enum:
            - draft
            - pending
      required:
        - title
        - address
        - capacity
        - surfaceM2
        - nightlyRateHtCents
    PropertyPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 140
        description:
          type: string
          maxLength: 4000
        address:
          type: object
          properties:
            street:
              type: string
              minLength: 3
              maxLength: 200
            postalCode:
              type: string
              pattern: ^75[0-9]{3}$
            city:
              default: Paris
              type: string
              minLength: 1
            arrondissement:
              type: integer
              minimum: 1
              maximum: 20
          required:
            - street
            - postalCode
            - arrondissement
        capacity:
          type: integer
          minimum: 1
          maximum: 30
        bedrooms:
          type: integer
          minimum: 0
          maximum: 20
        surfaceM2:
          type: integer
          minimum: 5
          maximum: 2000
        amenities:
          type: array
          items:
            type: string
            minLength: 1
        nightlyRateHtCents:
          type: integer
          minimum: 100
          maximum: 9007199254740991
        vatRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        blockedRanges:
          type: array
          items:
            type: object
            properties:
              start:
                type: string
                format: date-time
              end:
                type: string
                format: date-time
            required:
              - start
              - end
        status:
          type: string
          enum:
            - draft
            - pending
    PropertyStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - draft
            - pending
            - published
            - rejected
        rejectionReason:
          type: string
          maxLength: 500
      required:
        - status
    StayBookingRequest:
      type: object
      properties:
        propertyId:
          type: string
          pattern: ^[0-9a-f]{24}$
        startDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        endDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        guests:
          default: 1
          type: integer
          minimum: 1
          maximum: 30
      required:
        - propertyId
        - startDate
        - endDate
    ServiceBookingRequest:
      type: object
      properties:
        offeringId:
          type: string
          pattern: ^[0-9a-f]{24}$
        qty:
          default: 1
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100000
        scheduledAt:
          type: string
          format: date-time
        stayBookingId:
          type: string
          pattern: ^[0-9a-f]{24}$
        notes:
          type: string
          maxLength: 1000
      required:
        - offeringId
        - scheduledAt
    QuotePreviewRequest:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - stay
            stay:
              type: object
              properties:
                propertyId:
                  type: string
                  pattern: ^[0-9a-f]{24}$
                startDate:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                endDate:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                guests:
                  default: 1
                  type: integer
                  minimum: 1
                  maximum: 30
              required:
                - propertyId
                - startDate
                - endDate
          required:
            - kind
            - stay
        - type: object
          properties:
            kind:
              type: string
              enum:
                - service
            service:
              type: object
              properties:
                offeringId:
                  type: string
                  pattern: ^[0-9a-f]{24}$
                qty:
                  default: 1
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 100000
                scheduledAt:
                  type: string
                  format: date-time
                stayBookingId:
                  type: string
                  pattern: ^[0-9a-f]{24}$
                notes:
                  type: string
                  maxLength: 1000
              required:
                - offeringId
                - scheduledAt
          required:
            - kind
            - service
    BookingStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - requested
            - confirmed
            - completed
            - cancelled
      required:
        - status
    CheckoutRequest:
      type: object
      properties:
        tier:
          type: string
          enum:
            - bagpacker
            - explorator
        interval:
          type: string
          enum:
            - monthly
            - yearly
      required:
        - tier
        - interval
    PaymentIntentRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
            - stay
            - service
        bookingId:
          type: string
          pattern: ^[0-9a-f]{24}$
      required:
        - kind
        - bookingId
    FileUpload:
      type: object
      properties:
        kind:
          type: string
          enum:
            - property_photo
            - booking_attachment
            - inventory_report
        ownerUserId:
          type: string
          pattern: ^[0-9a-f]{24}$
        propertyId:
          type: string
          pattern: ^[0-9a-f]{24}$
        bookingId:
          type: string
          pattern: ^[0-9a-f]{24}$
      required:
        - kind
    ProviderPayoutPeriod:
      type: object
      properties:
        year:
          type: integer
          minimum: 2018
          maximum: 2100
        month:
          type: integer
          minimum: 1
          maximum: 12
      required:
        - year
        - month
    PayoutStatus:
      type: object
      properties:
        payoutStatus:
          type: string
          enum:
            - pending
            - sent
      required:
        - payoutStatus
    InterventionReport:
      type: object
      properties:
        performedAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 10080
        workDone:
          type: string
          minLength: 3
          maxLength: 4000
        materialsUsed:
          default: ""
          type: string
          maxLength: 2000
        incidents:
          default: ""
          type: string
          maxLength: 2000
        attachmentIds:
          default: []
          maxItems: 10
          type: array
          items:
            type: string
            pattern: ^[0-9a-f]{24}$
      required:
        - performedAt
        - durationMinutes
        - workDone
    ReviewSubmission:
      type: object
      properties:
        bookingId:
          type: string
          pattern: ^[0-9a-f]{24}$
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          default: ""
          type: string
          maxLength: 2000
      required:
        - bookingId
        - rating
    ReviewModeration:
      type: object
      properties:
        moderation:
          type: string
          enum:
            - approved
            - rejected
            - pending
        moderationReason:
          nullable: true
          type: string
          maxLength: 500
      required:
        - moderation
    Message:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - body
    SimulationInput:
      type: object
      properties:
        arrondissement:
          type: integer
          minimum: 1
          maximum: 20
        surfaceM2:
          type: integer
          minimum: 5
          maximum: 2000
        capacity:
          type: integer
          minimum: 1
          maximum: 30
        bedrooms:
          default: 1
          type: integer
          minimum: 0
          maximum: 20
        nightlyRateHtCents:
          type: integer
          minimum: 1000
          maximum: 10000000
        occupancyRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        averageStayNights:
          default: 3
          type: integer
          minimum: 1
          maximum: 365
        optionKeys:
          default: []
          maxItems: 20
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 60
      required:
        - arrondissement
        - surfaceM2
        - capacity
        - nightlyRateHtCents
        - occupancyRateBps
      additionalProperties: false
    LeadContact:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        phone:
          default: ""
          type: string
          maxLength: 20
      required:
        - firstName
        - lastName
        - email
      additionalProperties: false
    LeadQualification:
      type: object
      properties:
        status:
          type: string
          enum:
            - new
            - contacted
            - converted
            - archived
        notes:
          type: string
          maxLength: 2000
      additionalProperties: false
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: FORBIDDEN
            message:
              type: string
              example: Cette réservation ne vous appartient pas
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: "Présent uniquement sur VALIDATION_ERROR : champs fautifs et motifs."
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        db:
          type: string
          enum:
            - connected
            - disconnected
security: []
paths:
